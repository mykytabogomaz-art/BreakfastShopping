<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Покупки для сніданку</title>
<style>
  :root {
    --bg: #f3f6fb;
    --card: #ffffff;
    --ink: #1f2a3a;
    --muted: #6b778a;
    --accent: #00539f;
    --accent-soft: #e5eef8;
    --red: #e4002b;
    --ok: #1f8a4c;
    --ok-soft: #e3f4ea;
    --bad: #c8372d;
    --bad-soft: #fbe7e5;
    --line: #dbe2ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 18px;
    line-height: 1.45;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 22px;
    align-items: start;
  }
  h1 {
    grid-column: 1 / -1;
    margin: 4px 0 0;
    font-size: 28px;
  }

  /* ---------- Умова (завжди на екрані) ---------- */
  .condition {
    position: sticky;
    top: 16px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 2px 10px rgba(20, 40, 80, .08);
    overflow: hidden;
  }
  .cond-head {
    background: var(--accent);
    color: #fff;
    padding: 12px 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cond-head .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); }
  .cond-body { padding: 14px 18px 18px; }
  .cond-body p { margin: 0 0 10px; }
  .receipt {
    background: #fffdf6;
    border: 1px dashed #c9bfa4;
    border-radius: 10px;
    padding: 10px 14px;
    font-family: "Courier New", monospace;
    font-size: 16px;
    margin: 10px 0 12px;
  }
  .receipt .row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 6px;
  }
  .receipt .row small { display: block; color: var(--muted); font-family: "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
  .receipt .price { font-weight: 700; white-space: nowrap; }
  .paid {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
  }

  /* ---------- Запитання ---------- */
  .right { min-width: 0; }
  .progress { height: 12px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-bottom: 12px; }
  .progress-fill { height: 100%; width: 0; background: var(--ok); border-radius: 999px; transition: width .5s ease; }
  .quiz {
    display: flex; flex-direction: column; gap: 12px;
    max-height: 75vh;
    overflow-y: auto;
    padding: 2px 6px 2px 2px;
    scroll-behavior: smooth;
  }
  .q-card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 2px 10px rgba(20, 40, 80, .08);
    padding: 14px 18px 16px;
    flex-shrink: 0;
    animation: slideIn .35s ease;
    border-left: 6px solid var(--accent);
  }
  .q-card.solved { border-left-color: var(--ok); }
  .q-card.shown { border-left-color: #b9c3d1; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .q-num { color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .q-text { font-size: 17px; font-weight: 700; margin: 2px 0 12px; }

  .eq-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .eq-label { width: 100%; color: var(--muted); font-size: 14px; margin-bottom: -2px; }
  .eq-sign { font-size: 22px; font-weight: 700; color: var(--accent); }
  .money-input { display: flex; align-items: center; gap: 6px; }
  .pound { font-size: 19px; font-weight: 700; color: var(--accent); }
  input.field {
    font-size: 17px;
    padding: 7px 10px;
    border: 2px solid var(--line);
    border-radius: 10px;
    outline: none;
    color: var(--ink);
    background: #fff;
    font-family: inherit;
  }
  input.field:focus { border-color: var(--accent); }
  input.field.wrong { border-color: var(--bad); background: var(--bad-soft); }
  input.field.right { border-color: var(--ok); background: var(--ok-soft); }
  input.field:disabled { color: var(--ink); opacity: 1; }
  input.answer { width: 100px; }
  input.part { width: 70px; text-align: center; }
  .unit { font-size: 17px; font-weight: 700; color: var(--accent); }
  .eq-row.one-line { flex-wrap: nowrap; gap: 4px; }
  .one-line input.field { min-width: 0; padding: 6px 3px; text-align: center; font-size: 16px; }
  .one-line input.price { flex: 1 1 58px; width: 58px; }
  .one-line input.part { flex: 1 1 44px; width: 44px; }
  .one-line input.answer { flex: 1 1 62px; width: 62px; }
  .one-line .eq-sign { font-size: 17px; flex: none; }
  .one-line .unit { font-size: 15px; flex: none; }
  input.expr { flex: none; width: 72px; text-align: center; min-width: 0; font-family: "Courier New", monospace; letter-spacing: .02em; }

  .choices { display: flex; flex-wrap: wrap; gap: 10px; }
  .choice {
    font-size: 16px;
    padding: 8px 14px;
    border: 2px solid var(--line);
    background: #fff;
    border-radius: 12px;
    cursor: pointer;
    color: var(--ink);
    font-family: inherit;
  }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice.selected { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .choice:disabled { cursor: default; }
  .choice small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }

  .actions { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  button.btn {
    font-size: 16px;
    padding: 9px 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 700;
    font-family: inherit;
  }
  .btn-check { background: var(--accent); color: #fff; }
  .btn-next { background: var(--ok); color: #fff; }
  .btn-reveal { background: #edf1f6; color: var(--ink); }

  .feedback {
    margin-top: 10px;
    padding: 8px 12px;
    font-size: 15px;
    border-radius: 12px;
    display: none;
  }
  .feedback.ok { display: block; background: var(--ok-soft); color: #145c33; }
  .feedback.bad { display: block; background: var(--bad-soft); color: #8a2119; }
  .feedback .calc { font-family: "Courier New", monospace; font-weight: 700; display: block; margin-top: 4px; }

  .final {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 2px 10px rgba(20, 40, 80, .08);
    text-align: center;
    padding: 16px;
    flex-shrink: 0;
    animation: slideIn .35s ease;
  }
  .final .big { font-size: 40px; font-weight: 800; color: var(--accent); }
  .final p { font-size: 17px; margin: 4px 0; }

  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; gap: 14px; padding-top: 12px; }
    h1 { font-size: 23px; }
    .condition { position: static; }
    .cond-body { padding: 10px 14px 14px; }
    .cond-body p { font-size: 16px; margin-bottom: 6px; }
    .receipt { font-size: 15px; padding: 6px 10px; margin: 6px 0 8px; }
    .receipt .row { padding: 3px 4px; }
    .receipt .row small { display: inline; margin-left: 4px; }
    .q-card { padding: 12px 14px; }
    .q-text { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛒 Покупки для сніданку</h1>

  <!-- Умова -->
  <aside class="condition">
    <div class="cond-head"><span class="dot"></span> Умова задачі</div>
    <div class="cond-body">
      <p>Марія зайшла до супермаркету <b>Tesco</b>. Вона хоче купити продукти для сніданку.</p>
      <p>Вона купила:</p>
      <div class="receipt">
        <div class="row"><span>🍞 sliced bread <small>нарізаний хліб</small></span><span class="price">£1.25</span></div>
        <div class="row"><span>🥛 milk, 1 litre <small>молоко</small></span><span class="price">£1.15</span></div>
        <div class="row"><span>🍌 banana <small>банан</small></span><span class="price">£0.25</span></div>
        <div class="row"><span>🥣 yogurt, 500 g <small>йогурт</small></span><span class="price">£1.35</span></div>
      </div>
      <span class="paid">💷 Марія дала касиру £5</span>
    </div>
  </aside>

  <!-- Запитання -->
  <div class="right">
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <main class="quiz" id="quiz"></main>
  </div>
</div>

<script>
  const PRICES = { bread: 1.25, milk: 1.15, banana: 0.25, yogurt: 1.35 };

  const QUESTIONS = [
    {
      text: "Скільки всього коштують покупки?",
      type: "sum4",
      exprLabel: "Запиши ціну кожного продукту і порахуй суму:",
      op: "+",
      numbers: [1.25, 1.15, 0.25, 1.35],
      split: { pounds: 3, pence: 100 },
      answer: 4.00,
      exprHint: "У перші чотири клітинки запиши ціни продуктів з чека.",
      splitHint: "Склади окремо всі фунти (числа перед крапкою) і окремо всі пенси (числа після крапки).",
      hint: "Перетвори пенси на фунти: 100p = £1. Додай їх до фунтів.",
      explain: "£1.25 + £1.15 + £0.25 + £1.35 = £3 + 100p = £4.00"
    },
    {
      text: "Скільки фунтів Марія заплатила касиру?",
      type: "money",
      answer: 5,
      hint: "Подивись на останній рядок умови.",
      explain: "Марія дала касиру £5."
    },
    {
      text: "Скільки грошей залишилось після покупки? (решта)",
      type: "expr",
      exprLabel: "Запиши різницю:",
      op: "-",
      numbers: [5, 4],
      answer: 1.00,
      exprHint: "Від суми, яку Марія дала касиру, відніми вартість усіх покупок.",
      hint: "Порахуй: £5 мінус вартість покупок (£4.00).",
      explain: "£5.00 − £4.00 = £1.00"
    },
    {
      text: "Які два продукти коштують разом £2.40?",
      type: "pick2",
      answer: ["bread", "milk"],
      hint: "Спробуй додати ціни по два продукти. Сума має бути рівно £2.40.",
      explain: "Хліб + молоко: £1.25 + £1.15 = £2.40"
    }
  ];

  const PRODUCTS = [
    { id: "bread",  label: "🍞 sliced bread", ua: "хліб" },
    { id: "milk",   label: "🥛 milk",         ua: "молоко" },
    { id: "banana", label: "🍌 banana",       ua: "банан" },
    { id: "yogurt", label: "🥣 yogurt",       ua: "йогурт" }
  ];

  const quiz = document.getElementById("quiz");
  let current = 0;
  let firstTry = 0;

  /* ---------- допоміжне ---------- */
  function parseMoney(str) {
    const clean = str.replace(/£/g, "").replace(",", ".").trim();
    if (clean === "" || isNaN(Number(clean))) return null;
    return Number(clean);
  }

  // Розбирає вираз типу "1.25 + 1.15 + 0.25" або "5 - 4" → {nums, ops, value}
  function parseExpr(str) {
    let s = str.replace(/£/g, "").replace(/,/g, ".").replace(/[−–—]/g, "-").replace(/\s+/g, "");
    if (!/^[\d.+\-]+$/.test(s)) return null;
    const parts = s.split(/([+\-])/).filter(p => p !== "");
    if (parts.length < 3 || parts.length % 2 === 0) return null;
    const nums = [], ops = [];
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 0) {
        if (!/^\d*\.?\d+$/.test(parts[i])) return null;
        nums.push(Number(parts[i]));
      } else ops.push(parts[i]);
    }
    let value = nums[0];
    ops.forEach((o, i) => { value = o === "+" ? value + nums[i + 1] : value - nums[i + 1]; });
    return { nums, ops, value: Math.round(value * 100) / 100 };
  }

  const eq = (a, b) => Math.abs(a - b) < 0.001;

  function sameNumbers(a, b) {
    if (a.length !== b.length) return false;
    const x = [...a].sort((p, q) => p - q), y = [...b].sort((p, q) => p - q);
    return x.every((v, i) => eq(v, y[i]));
  }

  /* ---------- побудова картки ---------- */
  function renderQuestion(i) {
    const q = QUESTIONS[i];
    const card = document.createElement("section");
    card.className = "q-card";
    card.dataset.attempts = "0";

    let body = "";
    if (q.type === "sum4") {
      const priceBoxes = q.numbers.map(() =>
        `<input class="field price" data-role="price" inputmode="decimal" autocomplete="off">`).join(`<span class="eq-sign">+</span>`);
      body = `
        <div class="eq-label">${q.exprLabel}</div>
        <div class="eq-row one-line">
          ${priceBoxes}
          <span class="eq-sign">=</span>
          <input class="field part" data-role="pounds" inputmode="numeric" autocomplete="off"><span class="unit">£</span>
          <span class="eq-sign">+</span>
          <input class="field part" data-role="pence" inputmode="numeric" autocomplete="off"><span class="unit">p</span>
          <span class="eq-sign">=</span>
          <span class="unit">£</span><input class="field answer" data-role="ans" inputmode="decimal" autocomplete="off">
        </div>`;
    } else if (q.type === "expr") {
      body = `
        <div class="eq-row">
          <div class="eq-label">${q.exprLabel}</div>
          <input class="field expr" data-role="expr" inputmode="decimal" autocomplete="off">
          <span class="eq-sign">=</span>
          ${q.split ? `
          <span class="money-input"><input class="field part" data-role="pounds" inputmode="numeric" autocomplete="off"><span class="unit">£</span></span>
          <span class="eq-sign">+</span>
          <span class="money-input"><input class="field part" data-role="pence" inputmode="numeric" autocomplete="off"><span class="unit">p</span></span>
          <span class="eq-sign">=</span>` : ""}
          <span class="money-input"><span class="pound">£</span>
            <input class="field answer" data-role="ans" inputmode="decimal" autocomplete="off"></span>
        </div>`;
    } else if (q.type === "money") {
      body = `<div class="money-input"><span class="pound">£</span>
        <input class="field answer" data-role="ans" inputmode="decimal" autocomplete="off"></div>`;
    } else if (q.type === "pick2") {
      body = `<p style="margin:0 0 8px;color:var(--muted);font-size:14px">Вибери два продукти:</p><div class="choices">` +
        PRODUCTS.map(p => `<button class="choice" data-id="${p.id}">${p.label}<small>${p.ua}</small></button>`).join("") +
        `</div>`;
    }

    card.innerHTML = `
      <div class="q-text">${q.text}</div>
      ${body}
      <div class="actions">
        <button class="btn btn-check">Перевірити</button>
        <button class="btn btn-reveal" style="display:none">Показати відповідь</button>
      </div>
      <div class="feedback"></div>`;

    quiz.appendChild(card);

    card.querySelectorAll(".choice").forEach(btn => {
      btn.addEventListener("click", () => {
        const selected = card.querySelectorAll(".choice.selected");
        if (btn.classList.contains("selected")) btn.classList.remove("selected");
        else if (selected.length < 2) btn.classList.add("selected");
      });
    });

    card.querySelectorAll("input.field").forEach(inp => {
      inp.addEventListener("input", () => inp.classList.remove("wrong"));
      inp.addEventListener("keydown", e => {
        if (e.key !== "Enter") return;
        const all = [...card.querySelectorAll("input.field")];
        const next = all[all.indexOf(inp) + 1];
        if (next) next.focus(); else check(card, q);
      });
    });

    card.querySelector(".btn-check").addEventListener("click", () => check(card, q));
    card.querySelector(".btn-reveal").addEventListener("click", () => reveal(card, q));

    const first = card.querySelector("input.field");
    if (first) first.focus({ preventScroll: true });
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function clearFeedback(card) {
    const fb = card.querySelector(".feedback");
    fb.className = "feedback";
    fb.innerHTML = "";
  }

  function updateProgress() {
    document.getElementById("progressFill").style.width = (current / QUESTIONS.length * 100) + "%";
  }

  function showFeedback(card, kind, html) {
    const fb = card.querySelector(".feedback");
    fb.className = "feedback " + kind;
    fb.innerHTML = html;
  }

  /* ---------- перевірка ---------- */
  function check(card, q) {
    const exprInp = card.querySelector('[data-role="expr"]');
    const ansInp = card.querySelector('[data-role="ans"]');
    let ok = false, msg = "";

    if (q.type === "sum4") {
      const priceInps = [...card.querySelectorAll('[data-role="price"]')];
      const poundsInp = card.querySelector('[data-role="pounds"]');
      const penceInp = card.querySelector('[data-role="pence"]');
      const prices = priceInps.map(i => parseMoney(i.value));
      const pounds = parseMoney(poundsInp.value);
      const pence = parseMoney(penceInp.value.replace(/p/gi, ""));
      const ans = parseMoney(ansInp.value);
      if (prices.includes(null) || pounds === null || pence === null || ans === null) {
        showFeedback(card, "bad", "Заповни всі клітинки.");
        return;
      }
      // ціни можна писати в будь-якому порядку
      const left = [...q.numbers];
      let pricesOk = true;
      priceInps.forEach((inp, k) => {
        const idx = left.findIndex(v => eq(v, prices[k]));
        const good = idx !== -1;
        if (good) left.splice(idx, 1); else pricesOk = false;
        inp.classList.toggle("wrong", !good);
      });
      const pOk = eq(pounds, q.split.pounds), cOk = eq(pence, q.split.pence);
      poundsInp.classList.toggle("wrong", !pOk);
      penceInp.classList.toggle("wrong", !cOk);
      const ansOk = eq(ans, q.answer);
      ansInp.classList.toggle("wrong", !ansOk);
      ok = pricesOk && pOk && cOk && ansOk;
      if (!pricesOk) msg = `Перевір ціни в червоних клітинках.<br>💡 ${q.exprHint}`;
      else if (!(pOk && cOk)) msg = `Ціни записано правильно! Тепер порахуй фунти й пенси.<br>💡 ${q.splitHint}`;
      else msg = `Майже! Перевір остаточну відповідь.<br>💡 ${q.hint}`;
    } else if (q.type === "expr") {
      const ex = parseExpr(exprInp.value);
      const ans = parseMoney(ansInp.value);
      const poundsInp = card.querySelector('[data-role="pounds"]');
      const penceInp = card.querySelector('[data-role="pence"]');
      const pounds = poundsInp ? parseMoney(poundsInp.value) : 0;
      const pence = penceInp ? parseMoney(penceInp.value.replace(/p/gi, "")) : 0;
      if (exprInp.value.trim() === "" || ans === null || pounds === null || pence === null) {
        showFeedback(card, "bad", "Заповни всі поля.");
        return;
      }
      const opsOk = ex && ex.ops.every(o => o === q.op);
      const numsOk = ex && (q.op === "-"
        ? ex.nums.length === q.numbers.length && ex.nums.every((v, k) => eq(v, q.numbers[k]))
        : sameNumbers(ex.nums, q.numbers));
      const exprOk = ex && opsOk && numsOk;
      const ansOk = eq(ans, q.answer);
      exprInp.classList.toggle("wrong", !exprOk);
      ansInp.classList.toggle("wrong", !ansOk);
      let splitOk = true;
      if (q.split) {
        const pOk = eq(pounds, q.split.pounds), cOk = eq(pence, q.split.pence);
        poundsInp.classList.toggle("wrong", !pOk);
        penceInp.classList.toggle("wrong", !cOk);
        splitOk = pOk && cOk;
      }
      ok = exprOk && ansOk && splitOk;
      if (exprOk && !splitOk) msg = `Дію записано правильно! Тепер порахуй фунти й пенси.<br>💡 ${q.splitHint}`;
      else if (!exprOk && !ansOk) msg = `Перевір і дію, і відповідь.<br>💡 ${q.exprHint}`;
      else if (!exprOk) msg = !ex ? "Запиши дію числами, наприклад: 1.25 + 1.15"
                              : `Відповідь правильна, а дію треба записати повністю.<br>💡 ${q.exprHint}`;
      else msg = `Дію записано правильно! А відповідь ще ні — порахуй уважно.<br>💡 ${q.hint}`;
    } else if (q.type === "money") {
      const ans = parseMoney(ansInp.value);
      if (ans === null) { showFeedback(card, "bad", "Впиши число, наприклад 2.50"); return; }
      ok = eq(ans, q.answer);
      ansInp.classList.toggle("wrong", !ok);
      msg = `Ще не так. Спробуй ще раз.<br>💡 ${q.hint}`;
    } else if (q.type === "pick2") {
      const sel = [...card.querySelectorAll(".choice.selected")].map(b => b.dataset.id);
      if (sel.length !== 2) { showFeedback(card, "bad", "Вибери два продукти."); return; }
      ok = q.answer.every(id => sel.includes(id));
      msg = `Ще не так. Спробуй ще раз.<br>💡 ${q.hint}`;
    }

    const attempts = Number(card.dataset.attempts) + 1;
    card.dataset.attempts = attempts;

    if (ok) {
      if (attempts === 1) firstTry++;
      card.classList.add("solved");
      clearFeedback(card);
      finish(card);
    } else {
      showFeedback(card, "bad", msg);
      if (attempts >= 2) card.querySelector(".btn-reveal").style.display = "inline-block";
    }
  }

  function reveal(card, q) {
    card.classList.add("shown");
    if (q.type === "sum4") {
      card.querySelectorAll('[data-role="price"]').forEach((inp, k) => inp.value = q.numbers[k].toFixed(2));
      card.querySelector('[data-role="pounds"]').value = q.split.pounds;
      card.querySelector('[data-role="pence"]').value = q.split.pence;
      card.querySelector('[data-role="ans"]').value = q.answer.toFixed(2);
    } else if (q.type === "expr") {
      const expr = q.numbers.map(n => n.toFixed(2)).join(q.op === "+" ? " + " : " − ");
      card.querySelector('[data-role="expr"]').value = expr;
      card.querySelector('[data-role="ans"]').value = q.answer.toFixed(2);
      if (q.split) {
        card.querySelector('[data-role="pounds"]').value = q.split.pounds;
        card.querySelector('[data-role="pence"]').value = q.split.pence;
      }
    } else if (q.type === "money") {
      card.querySelector('[data-role="ans"]').value = q.answer.toFixed(2);
    } else {
      card.querySelectorAll(".choice").forEach(b => b.classList.toggle("selected", q.answer.includes(b.dataset.id)));
    }
    card.querySelectorAll("input.field").forEach(i => i.classList.remove("wrong"));
    clearFeedback(card);
    finish(card);
  }

  // Картка залишається на екрані, лише блокується; далі з'являється наступне питання
  function finish(card) {
    card.querySelectorAll("input, .choice").forEach(el => el.disabled = true);
    card.querySelectorAll("input.field").forEach(i => i.classList.add("right"));
    card.querySelector(".actions").remove();
    current++;
    updateProgress();
    if (current < QUESTIONS.length) setTimeout(() => renderQuestion(current), 500);
    else setTimeout(renderFinal, 500);
  }

  function renderFinal() {
    const total = QUESTIONS.length;
    const msg = firstTry === total ? "Чудово! Усе правильно з першої спроби! 🌟"
              : firstTry >= total - 1 ? "Дуже добре! 👍"
              : "Молодець, що дійшов до кінця! Спробуй ще раз 💪";
    const box = document.createElement("section");
    box.className = "final";
    box.innerHTML = `
      <div class="big">${firstTry} / ${total}</div>
      <p>правильних відповідей з першої спроби</p>
      <p><b>${msg}</b></p>
      <div class="actions" style="justify-content:center">
        <button class="btn btn-check">Пройти ще раз ↻</button>
      </div>`;
    quiz.appendChild(box);
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
    box.querySelector("button").addEventListener("click", () => {
      quiz.innerHTML = "";
      current = 0; firstTry = 0;
      updateProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderQuestion(0);
    });
  }

  renderQuestion(0);
</script>
</body>
</html>
